<!doctype html><html lang="th"><meta charset="utf-8"><title>Course v3 migration QA</title><body><h1>Local QA: progress migration</h1><p>ใช้เฉพาะ origin ทดสอบ local; สำรอง progress ก่อนสร้าง fixture และคืนค่าหลังตรวจ</p><button id="seed">สำรองและสร้าง v2 fixture</button><button id="restore">คืน progress ก่อนทดสอบ</button><pre id="status"></pre><a href="../../06-regression/animation.html#chapter-6/section/overview">ตรวจ Regression</a><script>
const keys=['ai-course-v2-progress','ai-course-v3-progress','ai-course-reduce-motion'],backupKey='ai-course-qa-backup';document.querySelector('#seed').onclick=()=>{if(!localStorage.getItem(backupKey))localStorage.setItem(backupKey,JSON.stringify(Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]))));localStorage.setItem(keys[0],JSON.stringify({version:2,chapters:{6:{read:['slope'],checks:['concept','shape'],answers:{shape:'0'},local:true}},lastRoute:'#chapter-6/section/slope'}));localStorage.removeItem(keys[1]);document.querySelector('#status').textContent='Fixture ready: v2 read slope, legacy2, local self-report true; v3 passes must start0'};document.querySelector('#restore').onclick=()=>{const raw=localStorage.getItem(backupKey);if(!raw){document.querySelector('#status').textContent='No backup';return}for(const[k,v]of Object.entries(JSON.parse(raw))){if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}localStorage.removeItem(backupKey);document.querySelector('#status').textContent='Restored original progress'};
</script></body></html>
