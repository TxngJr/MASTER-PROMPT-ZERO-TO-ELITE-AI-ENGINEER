name: Batch 06 Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-batch01.txt
            requirements-batch02.txt
            requirements-batch03.txt
            requirements-batch04.txt
            requirements-batch05.txt
            requirements-batch06.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-batch06.txt

      - name: Run tests through Batch 06
        env:
          MPLBACKEND: Agg
        run: |
          pytest -q             01-programming/tests             02-mathematics/tests             03-scientific-python/tests             integration-project/tests             04-data/tests             05-ml-fundamentals/tests             06-regression/tests             integration-project-batch02/tests             07-logistic-regression/tests             08-knn/tests             09-naive-bayes/tests             integration-project-batch03/tests             10-decision-tree/tests             11-random-forest/tests             12-gradient-boosting/tests             integration-project-batch04/tests             13-svm/tests             14-clustering/tests             15-dimensionality-reduction/tests             integration-project-batch05/tests             16-anomaly-detection/tests             17-time-series/tests             18-neural-network-foundations/tests             integration-project-batch06/tests
