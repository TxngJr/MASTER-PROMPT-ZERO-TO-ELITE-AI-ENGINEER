name: Batch 26 Core Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-batch01.txt
            requirements-batch02.txt
            requirements-batch03.txt
            requirements-batch04.txt
            requirements-batch05.txt
            requirements-batch06.txt
            requirements-batch07.txt
            requirements-batch08.txt
            requirements-batch09.txt
            requirements-batch10.txt
            requirements-batch11.txt
            requirements-batch12.txt
            requirements-batch13.txt
            requirements-batch14.txt
            requirements-batch15.txt
            requirements-batch16.txt
            requirements-batch17.txt
            requirements-batch18.txt
            requirements-batch19.txt
            requirements-batch20.txt
            requirements-batch21.txt
            requirements-batch22.txt
            requirements-batch23.txt
            requirements-batch24.txt
            requirements-batch25.txt
            requirements-batch26.txt

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-batch26.txt

      - name: Run all core tests through Batch 26
        env:
          MPLBACKEND: Agg
        run: pytest -q
