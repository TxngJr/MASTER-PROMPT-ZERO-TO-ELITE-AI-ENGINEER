name: Batch 08 TensorFlow Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tensorflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-batch08.txt
            requirements-batch08-tensorflow.txt

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-batch08.txt

      - name: Install TensorFlow
        run: |
          python -m pip install -r requirements-batch08-tensorflow.txt

      - name: Run TensorFlow tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          MPLBACKEND: Agg
        run: |
          pytest -q \
            23-tensorflow-keras/tests \
            integration-project-batch08/tests/test_tensorflow_smoke.py
