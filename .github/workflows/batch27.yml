name: Batch 27 Core Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-batch27.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-batch27.txt
      - env:
          MPLBACKEND: Agg
        run: pytest -q
