name: Batch 27 PyTorch Capstone Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytorch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-batch27.txt
            requirements-batch27-pytorch.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-batch27-pytorch.txt
      - run: pytest -q 80-build-llm-from-scratch/tests/test_tiny_llm_capstone.py
