name: Curriculum Completion Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  curriculum-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curriculum contract
        run: python tools/curriculum_audit.py
