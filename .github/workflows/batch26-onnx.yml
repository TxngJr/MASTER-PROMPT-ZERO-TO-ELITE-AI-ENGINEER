name: Batch 26 ONNX Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  onnxruntime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-batch26.txt
            requirements-batch26-onnx.txt

      - name: Install ONNX Runtime lab dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-batch26-onnx.txt

      - name: Run Batch 26 ONNX Runtime smoke
        run: |
          pytest -q \
            integration-project-batch26/tests/test_batch26_onnx_smoke.py
