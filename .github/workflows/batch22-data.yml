name: Batch 22 PyArrow Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parquet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-batch22.txt
            requirements-batch22-data.txt

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-batch22-data.txt

      - name: Run PyArrow Parquet smoke
        run: |
          pytest -q \
            integration-project-batch22/tests/test_batch22_pyarrow_smoke.py
